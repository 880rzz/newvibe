name: Browser visual QA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test engines
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Render all four languages in Chromium and WebKit
        run: node scripts/browser-visual-qa.cjs
      - name: Upload rendered evidence (mobile/desktop, all locales)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-visual-evidence
          path: qa-browser-screenshots/
          retention-days: 14
          if-no-files-found: warn
