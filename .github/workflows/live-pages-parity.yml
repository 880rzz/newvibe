name: Published Pages HTTP parity
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-pages-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-published-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare 48 public pages and 15 assets with checked-out SHA
        run: node scripts/live-pages-source-parity.cjs
