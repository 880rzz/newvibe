name: Static site quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prevent private print sources from entering the public repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          forbidden={'.pdf','.doc','.docx','.indd','.psd','.epub'}
          bad=[]
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() in forbidden:
                  bad.append(str(path))
              with path.open('rb') as source:
                  if source.read(5).startswith(b'%PDF-'):
                      bad.append(str(path)+' (PDF file signature)')
              if path.suffix.lower() in {'.zip','.jar'}:
                  try:
                      with ZipFile(path) as archive:
                          for entry in archive.infolist():
                              if entry.filename.lower().endswith(tuple(forbidden)):
                                  bad.append(str(path)+' :: '+entry.filename)
                              elif not entry.is_dir():
                                  with archive.open(entry) as source:
                                      if source.read(5).startswith(b'%PDF-'):
                                          bad.append(str(path)+' :: '+entry.filename+' (PDF signature)')
                  except BadZipFile:
                      bad.append(str(path)+' (invalid archive)')
          assert not bad,'Private manuscript/print files must not be published: '+repr(bad)
          print('Print-source privacy: no PDF or private manuscripts found.')
          PY
      - name: JavaScript syntax
        run: |
          node --check checkin-bank.js
          node --check app.js
          node --check product.js
          node --check locale-router.js
          node --check site-menu.js
          node scripts/locale-smoke.cjs
          node scripts/checkin-smoke.cjs
          node scripts/home-ux-smoke.cjs
          node scripts/menu-design-smoke.cjs
          node scripts/visual-design-smoke.cjs
      - name: Internal links, assets, JSON-LD and sitemap
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=set()
                  self.links=[]
                  self.ld=[]
                  self.in_ld=False
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if 'id' in d: self.ids.add(d['id'])
                  if tag=='a' and 'href' in d: self.links.append(d['href'])
                  if tag in ('script',) and d.get('type')=='application/ld+json': self.in_ld=True
                  if tag=='img' and d.get('src'):
                      self.links.append(d['src'])
                  if tag=='link' and d.get('href','').startswith('assets/'): self.links.append(d['href'])
              def handle_data(self,data):
                  if self.in_ld: self.ld.append(data)
              def handle_endtag(self,tag):
                  if tag=='script': self.in_ld=False
          for file in ('index.html','helyed-van-koztunk.html'):
              p=Audit();p.feed(Path(file).read_text(encoding='utf-8'))
              for raw in p.links:
                  if raw.startswith(('#','mailto:','https://','http://')): continue
                  assert Path(raw.split('#')[0].split('?')[0]).exists(), (file,raw)
              for raw in p.links:
                  if raw.startswith('#') and raw!='#':
                      assert raw[1:] in p.ids, (file,raw)
              for block in p.ld: json.loads(block)
          ET.parse('sitemap.xml')
          assert 'products/helyed-van-koztunk.html' in Path('sitemap.xml').read_text()
          product_html=Path('helyed-van-koztunk.html').read_text(encoding='utf-8')
          home_html=Path('index.html').read_text(encoding='utf-8')
          for number in (1,2,3):
              image=Path(f'assets/helyed-van-koztunk-{number:02d}.jpg')
              data=image.read_bytes()
              assert len(data)>10000 and data.startswith(bytes.fromhex('ffd8ff')) and data.endswith(bytes.fromhex('ffd9')), image
              assert image.name in product_html, image
          assert 'fep-home-hero' in home_html and 'fep-home-quiz' in home_html and 'fep-home-collection-bridge' in home_html
          assert 'https://880rzz.github.io/newvibe/assets/helyed-van-koztunk-03.jpg' in product_html
          assert 'href="mailto:' in product_html or 'SHOP_URL' in Path('product.js').read_text(encoding='utf-8')

          # For Every Path: validate all four localized routes and the expanding product registry.
          from urllib.parse import urlsplit
          langs=('en','hu','de','fr')
          slugs=('helyed-van-koztunk','egy-kis-ter','lepesrol-lepesre-2027','tanari-hataridonaplo-2027-szines','tanari-hataridonaplo-2027-letisztult','veled-a-mindennapokban','mesek-a-vilag-korul','mesek-a-vilag-korul-szinezo','na-most-mit-csinaljak')
          origin='https://880rzz.github.io/newvibe/'
          expected_pages=[]
          for lang in langs:
              base=Path('.') if lang=='en' else Path(lang)
              for suffix in ('index.html','catalog/index.html','about/index.html',*(f'products/{s}.html' for s in slugs)):
                  expected_pages.append(base/suffix)
          for filename in expected_pages:
              assert filename.is_file(), ('missing localized page',str(filename))
              html=filename.read_text(encoding='utf-8')
              p=Audit();p.feed(html)
              assert '<link rel="canonical"' in html and 'hreflang="x-default"' in html,filename
              assert 'foreverypath.com' not in html.split('<link rel="canonical"')[1].split('>')[0],filename
              assert 'For Every Path' in html,filename
              if filename.as_posix() not in ('index.html','hu/index.html','de/index.html','fr/index.html'):
                  assert 'locale-router.js?v=1' in html,('missing route guard',filename)
              else:
                  assert 'checkin-bank.js?v=1' in html and 'app.js?v=15' in html,('home lacks local interactive check-in',filename)
              for block in p.ld:
                  parsed=json.loads(block)
                  assert parsed.get('@context')=='https://schema.org',filename
                  for entity in parsed.get('@graph',[]):
                      if entity.get('@type')=='Product':
                          assert 'offers' not in entity and 'aggregateRating' not in entity,filename
                      assert entity.get('@type')!='Organization',('unverified company',filename)
              for raw in p.links:
                  if not raw or raw.startswith(('#','mailto:','https://','http://','tel:','javascript:')): continue
                  path=raw.split('#')[0].split('?')[0]
                  if not path:continue
                  target=(filename.parent/path)
                  assert target.exists(),('missing local link',str(filename),raw)
              for code in langs:
                  assert f'hreflang="{code}"' in html,('missing alternate',filename,code)
          root=ET.parse('sitemap.xml').getroot()
          namespace={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[i.text for i in root.findall('s:url/s:loc',namespace)]
          assert len(locs)==len(expected_pages)==48,(len(locs),len(expected_pages))
          assert len(set(locs))==48
          for f in expected_pages:
              rel=f.as_posix()
              expected=origin+('' if rel=='index.html' else rel.removesuffix('index.html'))
              if '/products/' in rel:expected=origin+rel
              assert expected in locs,('missing sitemap URL',expected)
          homepage=Path('index.html').read_text(encoding='utf-8')
          assert 'When words are hard to find and the to-do list keeps growing.' in homepage
          assert homepage.index('fep-home-hero') < homepage.index('id="quiz"') < homepage.index('fep-home-collection-bridge') < homepage.index('fep-home-author')
          assert 'class="fep-card"' not in homepage and 'fep-mini-product' not in homepage
          assert 'id="startQuiz"' in homepage and 'id="quizAgain"' in homepage
          assert '@import url("https://fonts.googleapis.com' in Path('catalog.css').read_text(encoding='utf-8')
          manifest=json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          assert len(manifest['products'])==9
          assert all(p['shop_url'] is None and p['price'] is None for p in manifest['products'])
          assert manifest['planned_domain']=='foreverypath.com'
          assert 'AI' in Path('ai.txt').read_text() and 'For Every Path' in Path('llms.txt').read_text()
          assert not Path('CNAME').exists(),'Custom domain must not be enabled before DNS/SSL verification'

          from hashlib import sha1
          expected_sha={
              'fep-adhd-concept.webp':'238863dc9e17728f6cc25f0c8a1140bad8b72146',
              'fep-teacher-warm-concept.webp':'852e4b4a15173bc4328ca98b723d38c9b56246e2',
              'fep-teacher-classic-concept.webp':'df4493b3996d7592fa365d08bebc1b335494dc0c',
              'fep-workbook-concept.webp':'6fa28a88245ec4a66b10b26b4a0ab677217ab897',
              'fep-collection-concept.webp':'7607405dfe1e6ef361ec0fa72f66824507c0586c',
              'fep-veled-a-mindennapokban-concept.webp':'b32a7f181da94b2d16dbb1671cadc8f07d5ddedb',
          }
          for filename,digest in expected_sha.items():
              data=Path('assets',filename).read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP',(filename,'invalid WebP')
              git_hash=sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()
              assert git_hash==digest,(filename,'unexpected binary content',git_hash)
          images={
              'egy-kis-ter':'fep-workbook-concept.webp',
              'lepesrol-lepesre-2027':'fep-adhd-concept.webp',
              'tanari-hataridonaplo-2027-szines':'fep-teacher-warm-concept.webp',
              'tanari-hataridonaplo-2027-letisztult':'fep-teacher-classic-concept.webp',
              'veled-a-mindennapokban':'fep-veled-a-mindennapokban-concept.webp'
          }
          for lang in langs:
              root=Path('.') if lang=='en' else Path(lang)
              for slug,filename in images.items():
                  html=(root/'products'/f'{slug}.html').read_text(encoding='utf-8')
                  assert filename in html,(lang,slug,'missing image')
                  assert any(word in html for word in ('AI-generated','AI-látványterv','KI-generierte','générée par IA','Visualisation IA')), (lang,slug,'missing provenance disclosure')
              html=(root/'products/helyed-van-koztunk.html').read_text(encoding='utf-8')
              assert 'helyed-van-koztunk-03.jpg' in html
          assert all((Path(p['image_path'])).exists() for p in manifest['products'])



          prayer=next((p for p in manifest['products'] if p['slug']=='veled-a-mindennapokban'),None)
          assert prayer and prayer['days']==30 and prayer['pages']==84 and prayer['format']=='A5'
          assert prayer['original_language']=='hu'
          assert prayer['shop_url'] is None and prayer['price'] is None
          assert all(p.get('editorial_status')=='professionally_approved_per_publisher_update_2026-11-21' for p in manifest['products']), 'publisher-approved editorial status must be consistent across all editions'
          assert 'veled-a-mindennapokban.html' in Path('catalog/index.html').read_text(encoding='utf-8')
          for lang in langs:
              root=Path('.') if lang=='en' else Path(lang)
              text=(root/'products/veled-a-mindennapokban.html').read_text(encoding='utf-8')
              assert '<h1>Veled a mindennapokban</h1>' in text
              assert '84 ' in text and 'A5' in text
              assert 'offers' not in text.lower()
              assert 'diofamuhelykozosseg@gmail.com' in text
              assert 'fep-veled-a-mindennapokban-concept.webp' in (root/'catalog/index.html').read_text(encoding='utf-8')


          new_diofa={
              'mesek-a-vilag-korul':(131,'fep-mesek-vilag-korul-concept.svg'),
              'mesek-a-vilag-korul-szinezo':(42,'fep-mesek-vilag-korul-szinezo-concept.svg'),
              'na-most-mit-csinaljak':(139,'fep-na-most-mit-csinaljak-concept.svg'),
          }
          for slug,(page_count,image_file) in new_diofa.items():
              item=next((p for p in manifest['products'] if p['slug']==slug),None)
              assert item is not None,(slug,'missing product')
              assert item['original_language']=='hu' and item['format']=='A4'
              assert item['number_of_pages']==page_count
              assert item['shop_url'] is None and item['price'] is None
              assert item['image_path']==f'assets/{image_file}'
              svg=Path('assets',image_file).read_text(encoding='utf-8')
              element=ET.fromstring(svg)
              assert element.tag=='{http://www.w3.org/2000/svg}svg'
              assert element.attrib['viewBox']=='0 0 840 1050'
              assert '<script' not in svg and '<foreignObject' not in svg
              assert 'not a photograph' in item['image_provenance']
              for lang in langs:
                  root=Path('.') if lang=='en' else Path(lang)
                  html=(root/'products'/f'{slug}.html').read_text(encoding='utf-8')
                  assert image_file in html and f'<h1>{item["slug"]}' not in html
                  assert item['shop_url'] is None
                  assert 'offers' not in html.lower()
                  assert '84 pages' not in html, (slug,lang,'wrong imported journal facts')
                  catalog=(root/'catalog/index.html').read_text(encoding='utf-8')
                  assert f'products/{slug}.html' in catalog and image_file in catalog
                  home=(root/'index.html').read_text(encoding='utf-8')
                  assert f'products/{slug}.html' not in home,(lang,'homepage must not list products')
          assert next(p for p in manifest['products'] if p['slug']=='mesek-a-vilag-korul')['production_status']=='final_editorial_content_print_source_available'
          for link in ('mesek-a-vilag-korul.html','mesek-a-vilag-korul-szinezo.html','na-most-mit-csinaljak.html'):
              assert link in Path('catalog/index.html').read_text(encoding='utf-8'),('missing product in catalogue',link)


          # Vector arrow quality gate: all nine products and new editions must use SVGs,
          # and language selectors remain simple text links.
          import re
          for htmlfile in Path('.').rglob('*.html'):
              if '.git' in htmlfile.parts:
                  continue
              rendered=htmlfile.read_text(encoding='utf-8')
              assert '<svg class="fep-up-icon"' in rendered, (htmlfile,'missing vector up arrow')
              assert 'class="fep-top-link"' in rendered and 'href="#top"' in rendered, (htmlfile,'missing back-to-top link')
              assert '<body id="top"' in rendered, (htmlfile,'no target for back-to-top')
              assert '↗' not in rendered and '↑' not in rendered, (htmlfile,'Unicode arrow not replaced')
              for anchor in re.finditer(r'<a\b([^>]*href="[^"]*products/[^"]+\.html"[^>]*)>([\s\S]*?)</a>',rendered):
                  attrs,label=anchor.group(1),anchor.group(2)
                  if re.fullmatch(r'(EN|HU|DE|FR)',label.strip()):
                      assert 'fep-vector-icon' not in label and 'fep-arrow-link' not in attrs, (htmlfile,'language link should stay icon-free')
                  elif 'button' in attrs:
                      assert '<svg' not in label,(htmlfile,'button CTA must not contain redundant arrow')
                  elif '<div' not in label and '<img' not in label and '<span class="fep-vector-icon"' not in label:
                      raise AssertionError((htmlfile,'text-only product link lacks a vector arrow',label[:80]))
          for lang in langs:
              langroot=Path('.') if lang=='en' else Path(lang)
              product_catalog=(langroot/'catalog/index.html').read_text(encoding='utf-8')
              assert product_catalog.count('class="button button-ink fep-card-action"')==len(manifest['products']), (lang,'catalogue product buttons')
              assert product_catalog.count('class="button button-coral fep-preorder-compact"')==len(manifest['products']), (lang,'catalogue preorder buttons')
          assert 'fep-up-icon' in homepage and '.fep-vector-icon' in Path('catalog.css').read_text(encoding='utf-8')
          # Editorial footers intentionally use plain-text links (not CTA pills or decorative arrows).
          # Keep the SVG product-link checks above; validate footers independently on all 48 routes.
          for lang in langs:
              root=Path('.') if lang=='en' else Path(lang)
              routed=[root/'index.html',root/'catalog/index.html',root/'about/index.html',*(root/'products').glob('*.html')]
              assert len(routed)==12,(lang,'expected twelve localized routes')
              for htmlfile in routed:
                  rendered=htmlfile.read_text(encoding='utf-8')
                  footer=re.search(r'<footer class="fep-footer section-shell">([\s\S]*?)</footer>',rendered)
                  assert footer,(htmlfile,'missing editorial footer')
                  foot=footer.group(1)
                  assert 'class="fep-footer-nav"' in foot,(htmlfile,'missing footer navigation')
                  assert '#impressum' in foot and '#how-made' in foot,(htmlfile,'missing imprint or editorial link')
                  assert 'mailto:diofamuhelykozosseg@gmail.com' in foot,(htmlfile,'missing real contact')
                  assert not re.search(r'class="[^"]*\bbutton\b',foot),(htmlfile,'footer must contain no CTA buttons')
                  assert 'catalog.css?v=8' in rendered,(htmlfile,'stale design CSS')
          assert '.fep-top-link' in Path('catalog.css').read_text(encoding='utf-8')


          # Email pre-orders are requests, not confirmed purchases or checkout.
          from urllib.parse import urlsplit, parse_qs
          from html import unescape
          assert manifest['email_preorders']['status']=='preorder_requests_accepted'
          assert manifest['email_preorders']['request_is_confirmed_order'] is False
          assert manifest['email_preorders']['payment_on_website'] is False
          assert manifest['email_preorders']['email']=='diofamuhelykozosseg@gmail.com'
          assert len(manifest['products'])==9
          required_categories={'naplok-tervezok':4,'segito-onreflexio':2,'mesek-foglalkoztatok':3}
          assert {x['id'] for x in manifest['product_categories']}==set(required_categories), 'category registry parity'
          assert len({slug for c in manifest['product_categories'] for slug in c['slugs']})==9,'each product has one canonical category'
          for category in manifest['product_categories']:
              assert len(category['slugs'])==required_categories[category['id']],category['id']
              assert set(category['labels'])==set(langs), category['id']
          for product in manifest['products']:
              assert sum(product['slug'] in c['slugs'] and product['category_id']==c['id'] for c in manifest['product_categories'])==1, product['slug']
          for product in manifest['products']:
              assert product['preorder_request']['status']=='accepted_by_email'
              assert product['preorder_request']['confirmation_required'] is True
              assert product['shop_url'] is None and product['price'] is None
              if product['slug'] in ('mesek-a-vilag-korul','mesek-a-vilag-korul-szinezo'):
                  assert 'lawful publication rights' in product['preorder_request'].get('fulfilment_condition',''),('commercial rights are separate from editorial approval',product['slug'])
              else:
                  assert 'fulfilment_condition' not in product['preorder_request']
          for language in langs:
              base=Path('.') if language=='en' else Path(language)
              catalogue=(base/'catalog/index.html').read_text(encoding='utf-8')
              assert catalogue.count('class="fep-preorder-badge"')==9,(language,'preorder status count')
              assert catalogue.count('class="button button-coral fep-preorder-compact"')==9,(language,'catalogue preorder links')
              # The public availability message must be an email preorder, not an editorial review status.
              expected_badge={'en':'Pre-order by email','hu':'Előrendelhető e-mailben','de':'Per E-Mail vorbestellbar','fr':'Précommande par e-mail'}[language]
              expected_state={'en':'Prices to follow · Webshop coming soon','hu':'Árak hamarosan · Webshop készül','de':'Preise folgen · Webshop in Vorbereitung','fr':'Prix à venir · Boutique en préparation'}[language]
              assert catalogue.count(f'<p class="fep-preorder-badge">{expected_badge}</p>')==len(manifest['products']),(language,'badge copy mismatch')
              assert catalogue.count(f'<p class="fep-state">{expected_state}</p>')==len(manifest['products']),(language,'public availability mismatch')
              assert 'fep-catalog-preorder-info' in catalogue
              for product in manifest['products']:
                  slug=product['slug']
                  content=(base/'products'/f'{slug}.html').read_text(encoding='utf-8')
                  assert content.count('class="fep-availability fep-preorder"')==1,(language,slug)
                  assert 'class="button button-coral fep-preorder-action"' in content and 'fep-preorder-icon' not in content
                  assert 'href="mailto:diofamuhelykozosseg@gmail.com?subject=' in content
                  matches=re.findall(r'href="(mailto:diofamuhelykozosseg@gmail.com\?subject=[^"]+)"',content)
                  assert matches,(language,slug,'missing contact href')
                  url=urlsplit(unescape(matches[0]))
                  params=parse_qs(url.query,keep_blank_values=True)
                  assert params.get('subject') and params.get('body'),(language,slug,'missing mail content')
                  assert 'For Every Path' in params['subject'][0]
                  assert len(params['body'][0])>130
                  assert '<script type="application/ld+json">' in content
                  if slug in ('mesek-a-vilag-korul','mesek-a-vilag-korul-szinezo'):
                      assert 'fep-preorder-rights' in content,(language,slug,'required neutral commercial-rights clarification')
                  else:
                      assert 'fep-preorder-rights' not in content,(language,slug,'unexpected rights notice')
              home=(base/'index.html').read_text(encoding='utf-8')
              assert 'fep-preorder-badge' not in home and 'fep-preorder-compact' not in home,(language,'homepage is not a shop')
              assert home.count('class="fep-card"')==0 and 'fep-mini-product' not in home,(language,'no duplicated catalogue')
              about=(base/'about/index.html').read_text(encoding='utf-8')
              assert 'fep-about-preorder' in about,(language,'missing terms in trust page')
          root_home=Path('index.html').read_text(encoding='utf-8')
          assert root_home.count('data-preorder-slug=')==0
          root_script=Path('app.js').read_text(encoding='utf-8')
          assert 'globalThis.fepCheckinBank.drawSix(lang)' in root_script and 'fepPreorderMailto' not in root_script
          assert 'preorderCopy' in Path('product.js').read_text(encoding='utf-8')
          assert 'pre-order requests' in Path('llms.txt').read_text(encoding='utf-8').lower()


          # Editorial UX: the optional adult check-in is reachable from every public entry.
          root=Path('index.html').read_text(encoding='utf-8')
          script=Path('app.js').read_text(encoding='utf-8')
          assert 'id="quiz"' in root and 'id="quizResult"' in root
          assert 'id="quizProductLink"' in root and 'fep-quiz-boundary' in root
          assert 'newvibe.lastReflection' not in script and 'QUIZ_SAVE_KEY' not in script
          assert 'checkinMixed' in script and 'quizData' in script
          assert root.index('src="checkin-bank.js?v=1"') < root.index('src="app.js?v=15"'), 'question bank must load before app'
          assert 'globalThis.fepCheckinBank.drawSix(lang)' in script, 'start and restart must securely redraw'
          assert 'selected.length' in script, 'progress must remain six of six'
          assert 'localStorage.setItem' not in Path('checkin-bank.js').read_text(encoding='utf-8'), 'no saved questionnaire history'
          assert 'Try another six questions' in root, 'restart should draw a fresh set'
          assert 'fep.checkin' not in script.lower() or 'localstorage.setitem("fep.checkin"' not in script.lower()
          assert 'role="progressbar"' in root and 'aria-valuemax="6"' in root
          statuses={'en':'Pre-order by email','hu':'Előrendelhető e-mailben','de':'Per E-Mail vorbestellbar','fr':'Précommande par e-mail'}
          for language in langs:
              base=Path('.') if language=='en' else Path(language)
              cat=(base/'catalog/index.html').read_text(encoding='utf-8')
              assert 'href="../index.html#quiz"' in cat,(language,'catalogue cannot reach same-language check-in')
              home=(base/'index.html').read_text(encoding='utf-8')
              assert 'href="#quiz"' in home,(language,'interactive check-in missing from homepage')
              for product in manifest['products']:
                  detail=(base/'products'/(product['slug']+'.html')).read_text(encoding='utf-8')
                  assert f'<p class="fep-preorder-badge">{statuses[language]}</p>' in detail,(language,product['slug'],'missing title-level preorder status')
                  assert ('review pending' not in detail.lower() and 'lektorálás előtt' not in detail.lower() and 'vor begutachtung' not in detail.lower() and 'relecture à venir' not in detail.lower()),(language,product['slug'],'obsolete editorial review status')
          assert 'separat' in Path('products/helyed-van-koztunk.html').read_text(encoding='utf-8').lower()
          assert 'külön nyomdai segédanyagként' in Path('hu/products/helyed-van-koztunk.html').read_text(encoding='utf-8').lower()
          assert all(p['production_status'] in ('physical_product_photographed','publisher_confirms_final_publication_approved_email_preorder','final_editorial_content_print_source_available') for p in manifest['products'])
          for locale in langs:
              root=Path('.') if locale=='en' else Path(locale)
              for product in manifest['products']:
                  page=(root/'products'/(product['slug']+'.html')).read_text(encoding='utf-8')
                  assert 'fep-preorder-badge' in page, (locale,product['slug'])
                  if product['slug'] in ('mesek-a-vilag-korul','mesek-a-vilag-korul-szinezo'):
                      assert 'fep-preorder-rights' in page,(locale,product['slug'],'neutral legal distinction missing')
                  else:
                      assert 'fep-preorder-rights' not in page,(locale,product['slug'],'unexpected legal banner')
          # Five-second clarity and canonical four-language UX parity.
          home_labels={
              'en':('When words are hard to find','Skip to content','Try another six questions'),
              'hu':('Amikor a szavak nehezen jönnek','Ugrás a tartalomra','Másik hat kérdés'),
              'de':('Wenn die Worte fehlen','Zum Inhalt springen','Sechs neue Fragen'),
              'fr':('Quand les mots manquent','Aller au contenu','Six autres questions')
          }
          for language in langs:
              base=Path('.') if language=='en' else Path(language)
              home=(base/'index.html').read_text(encoding='utf-8')
              catalogue=(base/'catalog/index.html').read_text(encoding='utf-8')
              title,skip,restart=home_labels[language]
              assert f'<html lang="{language}">' in home
              assert title in home and skip in home and restart in home,(language,'untranslated home content')
              assert home.index('fep-home-hero') < home.index('id="quiz"') < home.index('fep-home-collection-bridge') < home.index('fep-home-author'),(language,'homepage flow')
              assert home.count('<h1')==1,(language,'only one H1')
              assert 'fep-catalog-grid' not in home and 'fep-diofa-home-grid' not in home,(language,'duplicate catalogue')
              assert 'checkin-bank.js?v=1' in home and 'app.js?v=15' in home,(language,'check-in must run locally')
              assert catalogue.count('class="fep-card"')==9,(language,'nine product cards')
              assert catalogue.count('fep-card-language')==9,(language,'original publication language shown')
              assert 'fep-visual--square' in catalogue,(language,'genuine card photo is square')
              if language!='en':
                  for bad in ('Skip to content','AI & Editorial Trust'):
                      assert bad not in home and bad not in catalogue,(language,'English UI leakage',bad)
              for product in manifest['products']:
                  detail=(base/'products'/(product['slug']+'.html')).read_text(encoding='utf-8')
                  assert 'fep-product-language' in detail,(language,product['slug'],'publication language absent')
                  if language!='en':
                      for bad in ('Skip to content','AI & Editorial Trust'):
                          assert bad not in detail,(language,product['slug'],'English UI leakage',bad)
          css=Path('catalog.css').read_text(encoding='utf-8')
          assert '.fep-card .fep-visual--square{aspect-ratio:1/1}' in css
          assert '.fep-card .fep-visual{min-height:0;display:block;aspect-ratio:4/5;' in css
          assert '.fep-page a:not(.fep-skip):hover' in css and 'text-decoration:none' in css
          assert Path('docs/SITE_EDITORIAL_UX_AUDIT_2026-11-21.md').exists()
          assert 'professionally_approved_per_publisher_update_2026-11-21' in Path('catalog.json').read_text(encoding='utf-8')
          assert 'independent professional review and reader testing still outstanding' not in Path('llms.txt').read_text(encoding='utf-8')
          print('Site validation OK')
          PY
