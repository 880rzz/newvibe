name: Static site quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check product.js
      - name: Internal links, assets, JSON-LD and sitemap
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=set()
                  self.links=[]
                  self.ld=[]
                  self.in_ld=False
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if 'id' in d: self.ids.add(d['id'])
                  if tag=='a' and 'href' in d: self.links.append(d['href'])
                  if tag in ('script',) and d.get('type')=='application/ld+json': self.in_ld=True
                  if tag=='img' and d.get('src'):
                      self.links.append(d['src'])
                  if tag=='link' and d.get('href','').startswith('assets/'): self.links.append(d['href'])
              def handle_data(self,data):
                  if self.in_ld: self.ld.append(data)
              def handle_endtag(self,tag):
                  if tag=='script': self.in_ld=False
          for file in ('index.html','helyed-van-koztunk.html'):
              p=Audit();p.feed(Path(file).read_text(encoding='utf-8'))
              for raw in p.links:
                  if raw.startswith(('#','mailto:','https://','http://')): continue
                  assert Path(raw.split('#')[0].split('?')[0]).exists(), (file,raw)
              for raw in p.links:
                  if raw.startswith('#') and raw!='#':
                      assert raw[1:] in p.ids, (file,raw)
              for block in p.ld: json.loads(block)
          ET.parse('sitemap.xml')
          assert 'products/helyed-van-koztunk.html' in Path('sitemap.xml').read_text()
          product_html=Path('helyed-van-koztunk.html').read_text(encoding='utf-8')
          home_html=Path('index.html').read_text(encoding='utf-8')
          for number in (1,2,3):
              image=Path(f'assets/helyed-van-koztunk-{number:02d}.jpg')
              data=image.read_bytes()
              assert len(data)>10000 and data.startswith(bytes.fromhex('ffd8ff')) and data.endswith(bytes.fromhex('ffd9')), image
              assert image.name in product_html, image
          assert 'helyed-van-koztunk-03.jpg' in home_html
          assert 'https://880rzz.github.io/newvibe/assets/helyed-van-koztunk-03.jpg' in product_html
          assert 'href="mailto:' in product_html or 'SHOP_URL' in Path('product.js').read_text(encoding='utf-8')

          # For Every Path: validate all four localized routes and the expanding product registry.
          from urllib.parse import urlsplit
          langs=('en','hu','de','fr')
          slugs=('helyed-van-koztunk','egy-kis-ter','lepesrol-lepesre-2027','tanari-hataridonaplo-2027-szines','tanari-hataridonaplo-2027-letisztult')
          origin='https://880rzz.github.io/newvibe/'
          expected_pages=[]
          for lang in langs:
              base=Path('.') if lang=='en' else Path(lang)
              for suffix in ('index.html','catalog/index.html','about/index.html',*(f'products/{s}.html' for s in slugs)):
                  expected_pages.append(base/suffix)
          for filename in expected_pages:
              assert filename.is_file(), ('missing localized page',str(filename))
              html=filename.read_text(encoding='utf-8')
              p=Audit();p.feed(html)
              assert '<link rel="canonical"' in html and 'hreflang="x-default"' in html,filename
              assert 'foreverypath.com' not in html.split('<link rel="canonical"')[1].split('>')[0],filename
              assert 'For Every Path' in html,filename
              for block in p.ld:
                  parsed=json.loads(block)
                  assert parsed.get('@context')=='https://schema.org',filename
                  for entity in parsed.get('@graph',[]):
                      if entity.get('@type')=='Product':
                          assert 'offers' not in entity and 'aggregateRating' not in entity,filename
                      assert entity.get('@type')!='Organization',('unverified company',filename)
              for raw in p.links:
                  if not raw or raw.startswith(('#','mailto:','https://','http://','tel:','javascript:')): continue
                  path=raw.split('#')[0].split('?')[0]
                  if not path:continue
                  target=(filename.parent/path)
                  assert target.exists(),('missing local link',str(filename),raw)
              for code in langs:
                  assert f'hreflang="{code}"' in html,('missing alternate',filename,code)
          root=ET.parse('sitemap.xml').getroot()
          namespace={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[i.text for i in root.findall('s:url/s:loc',namespace)]
          assert len(locs)==len(expected_pages)==32,(len(locs),len(expected_pages))
          assert len(set(locs))==32
          for f in expected_pages:
              rel=f.as_posix()
              expected=origin+('' if rel=='index.html' else rel.removesuffix('index.html'))
              if '/products/' in rel:expected=origin+rel
              assert expected in locs,('missing sitemap URL',expected)
          manifest=json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          assert len(manifest['products'])==5
          assert all(p['shop_url'] is None and p['price'] is None for p in manifest['products'])
          assert manifest['planned_domain']=='foreverypath.com'
          assert 'AI' in Path('ai.txt').read_text() and 'For Every Path' in Path('llms.txt').read_text()
          assert not Path('CNAME').exists(),'Custom domain must not be enabled before DNS/SSL verification'

          from hashlib import sha1
          expected_sha={
              'fep-adhd-concept.webp':'df4493b3996d7592fa365d08bebc1b335494dc0c',
              'fep-teacher-warm-concept.webp':'852e4b4a15173bc4328ca98b723d38c9b56246e2',
              'fep-teacher-classic-concept.webp':'238863dc9e17728f6cc25f0c8a1140bad8b72146',
              'fep-workbook-concept.webp':'6fa28a88245ec4a66b10b26b4a0ab677217ab897',
              'fep-collection-concept.webp':'7607405dfe1e6ef361ec0fa72f66824507c0586c',
          }
          for filename,digest in expected_sha.items():
              data=Path('assets',filename).read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP',(filename,'invalid WebP')
              git_hash=sha1(b'blob '+str(len(data)).encode()+b'\\x00'+data).hexdigest()
              assert git_hash==digest,(filename,'unexpected binary content',git_hash)
          images={
              'egy-kis-ter':'fep-workbook-concept.webp',
              'lepesrol-lepesre-2027':'fep-adhd-concept.webp',
              'tanari-hataridonaplo-2027-szines':'fep-teacher-warm-concept.webp',
              'tanari-hataridonaplo-2027-letisztult':'fep-teacher-classic-concept.webp'
          }
          for lang in langs:
              root=Path('.') if lang=='en' else Path(lang)
              for slug,filename in images.items():
                  html=(root/'products'/f'{slug}.html').read_text(encoding='utf-8')
                  assert filename in html,(lang,slug,'missing image')
                  assert any(word in html for word in ('AI-generated','AI-látványterv','KI-generierte','générée par IA')), (lang,slug,'missing provenance disclosure')
              html=(root/'products/helyed-van-koztunk.html').read_text(encoding='utf-8')
              assert 'helyed-van-koztunk-03.jpg' in html
          assert all((Path(p['image_path'])).exists() for p in manifest['products'])


          print('Site validation OK')
          PY
