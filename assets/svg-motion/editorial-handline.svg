]]></style><g class="fep-soft-move"><path d="M6 60C60 19 107 107 158 54S233 53 234 53" stroke="#275245" stroke-width="3" stroke-linecap="round"/><circle cx="115" cy="73" r="6" fill="#d9846b"/><circle cx="174" cy="38" r="5" fill="#dbb95b"/></g></svg>