<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 110" fill="none" role="presentation"><style><![CDATA[
.fep-soft-move{transform-box:fill-box;transform-origin:50% 50%;animation:fep-bob 9.8s ease-in-out infinite}
@keyframes fep-bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1.4deg)}}
