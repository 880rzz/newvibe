<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 190" width="260" height="190" fill="none" stroke-linecap="round" stroke-linejoin="round"><style><![CDATA[
.trace{stroke-dasharray:440;stroke-dashoffset:0;animation:ink 11s ease-in-out infinite}
.float{transform-box:fill-box;transform-origin:50% 50%;animation:float 7s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 50%;animation:sway 8.5s ease-in-out infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
@keyframes ink{0%,100%{stroke-dashoffset:0;opacity:1}50%{stroke-dashoffset:21;opacity:.8}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@keyframes pulse{0%,100%{transform:scale(.92);opacity:.65}50%{transform:scale(1.08);opacity:1}}
@media(prefers-reduced-motion:reduce){.trace,.float,.sway,.spark{animation:none!important}}
]]></style><g class="float" stroke="#315548" stroke-width="3"><path d="M30 92c30-17 69-15 101-1 29-14 64-16 99 0v65c-36-9-69-10-99 5-38-17-70-16-101-5V92Z" fill="#FFF8E9"/><path d="M131 91v70M41 145c31-8 51-6 80 3M141 148c33-9 54-12 79-2" stroke-width="2.1" opacity=".6"/></g><g class="trace" stroke="#608C89" stroke-width="2.6"><path d="M48 102l19-8 25 8 4 19-25 15-19-8Z" fill="#A8C6BE" opacity=".8"/><path d="M155 105l25-15 25 9-2 21-31 11-18-10Z" fill="#EAD3A1" opacity=".85"/></g><g stroke="#B56E4F" stroke-width="2.4" fill="#E6A082"><path d="M91 45c21-23 56-25 75-5M96 44c10 13 26 18 39 19 14-2 21-11 27-20"/><path d="M130 19v59M105 26c-10 17-10 34 1 49M154 25c10 16 10 36 0 49" fill="none"/></g><g class="spark" stroke="#D59A56" stroke-width="2.5"><path d="M190 23l6 10 10-6-6 10 9 6-12-1-2 11-4-11-10 1 8-9-6-9 10 3Z" fill="#F6D57C"/><path d="M70 46v12M64 52h12"/></g></svg>