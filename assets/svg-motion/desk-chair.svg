<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220" fill="none" stroke-linecap="round" stroke-linejoin="round"><style><![CDATA[
.trace{stroke-dasharray:440;stroke-dashoffset:0;animation:ink 11s ease-in-out infinite}
.float{transform-box:fill-box;transform-origin:50% 50%;animation:float 7s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 50%;animation:sway 8.5s ease-in-out infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
@keyframes ink{0%,100%{stroke-dashoffset:0;opacity:1}50%{stroke-dashoffset:21;opacity:.8}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@keyframes pulse{0%,100%{transform:scale(.92);opacity:.65}50%{transform:scale(1.08);opacity:1}}
@media(prefers-reduced-motion:reduce){.trace,.float,.sway,.spark{animation:none!important}}
]]></style><g stroke="#315548" stroke-width="3.1" class="trace"><path d="M20 109L150 97l13 17-9 66M32 117l-6 73M35 122l111-6M178 106c9-48 53-66 67-31l8 52M190 106c5-33 38-46 48-24l5 37M166 126c25-21 69-17 85 6 8 12-5 27-29 31-38 7-70-8-56-37ZM185 158l-9 39M239 157l16 40"/></g><g stroke="#B56F54" stroke-width="2.8" class="float"><path d="M45 93l1-34 48-1 1 33M56 61c7-18 25-17 29 0M57 76c7 6 18 6 27 0"/><path d="M114 86l13-20 15 13-13 14Z" fill="#F2D788"/><path d="M206 119l-9-26 29-2 18 32-8 18-31-2Z" fill="#F1E4C8"/><path d="M206 92c1-19 22-22 22-1"/></g><g stroke="#668A91" stroke-width="2.3"><path d="M71 103c16-6 35-6 49 2l15 8c-18 0-32 3-46 8-12-6-23-7-41-5l23-13Z" fill="#FFF6E5"/><path d="M90 106l-1 14M33 202l229-2" opacity=".35"/></g><g class="spark" stroke="#D69F55" stroke-width="2.2"><path d="M259 35v14M252 42h14M270 54l5 5M268 60l-5 4"/></g></svg>