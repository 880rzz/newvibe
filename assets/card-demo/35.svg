<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 880" width="630" height="880" data-card="35" data-format="original-vector-demo" role="img" aria-labelledby="title desc"><title id="title">És holnap?</title><desc id="desc">A nyomdai kártya jelenetéből készült új, sematikus, animált vektorillusztráció. Nem az eredeti nyomdai grafika.</desc><style><![CDATA[
.flow{transform-box:fill-box;transform-origin:center;animation:flow 7s ease-in-out infinite}
.glow{transform-box:fill-box;transform-origin:center;animation:glow 5s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:center;animation:sway 8s ease-in-out infinite}
@keyframes flow{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow{0%,100%{opacity:.38;transform:scale(.96)}50%{opacity:.68;transform:scale(1.05)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.flow,.glow,.sway{animation:none!important}}
